name: Reproducible checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / ${{ matrix.os }} / Python 3.13
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      YOLO_AUTOINSTALL: "false"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install OS libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 libgl1
      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install the submitted manifest into a fresh venv
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
            .venv/Scripts/python -m pip install -r requirements.txt
          else
            echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
            .venv/bin/python -m pip install -r requirements.txt
          fi
      - name: Full suite and dependency-origin audit
        run: python scripts/verify_submission.py --out evals/verification-ci.json
      - name: Download and verify the documented model assets
        run: python scripts/fetch_weights.py
      - name: Load both local models on CPU
        env:
          PYTHONPATH: backend
        run: python -c "from app.scene import warmup; warmup()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: evals/verification-ci.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: node --test tests/inspection.test.cjs
      - run: npm run build
