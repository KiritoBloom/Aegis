# Corridor camera, calibrated to real fixed-camera surveillance — demo build.
#
# Identical to edge_cctv.yaml except the corridor tripwire is armed all day.
# The product's night rule (22:00-06:00) is the honest default and it is what
# edge_cctv.yaml keeps; this variant exists so a demo recorded in the afternoon
# can show the door/corridor escalation path without waiting for 10 PM.
#
# Every number here was measured against the pixels in the clip named below, and
# scripts/probe_zones.py prints where real foot points land in each polygon.
camera:
  source: file:data/reels/cctv_corridor.mp4
  width: 640
  height: 480
  fps: 15
  realtime: true
  loop: true
household:
  id: hh_demo
  timezone: Africa/Cairo
  resident_name: Margaret
door:
  # The corridor's far end IS the exit for this camera: crossing it means she
  # has walked out of the camera's reach. The rule engine keys off the zone
  # named here, so the zone is named front_door and this points at it.
  zone: front_door
  dwell_s: 2.0
  region_diff_ratio: 0.12
  left_open_s: 120.0
motion:
  downscale:
  - 160
  - 120
  min_changed_ratio: 0.006
  persistence_frames: 2
  cooldown_s: 2.0
  ignore_zones:
  - tv
  - window
  - private
person:
  model: yolov8n.pt
  imgsz: 640
  conf_day: 0.40
  conf_night: 0.32
  min_area_ratio: 0.004
  max_fps: 8
  tracker: bytetrack.yaml
fall:
  enabled: true
  suspect_score: 0.6
  confirm_score: 0.8
  no_recovery_s: 8
clip:
  pre_s: 6
  post_s: 4
  fps: 10
  crf: 26
  max_mb: 8
zones:
- name: front_door
  type: tripwire
  points:
  # Measured, not eyeballed. The runner builds track history for the primary
  # (largest) detection only, and scripts/probe_door_rule.py shows that person
  # walking from (0.85,0.99) at the shopfront out to (0.18,0.66) at the left
  # edge. This band sits on the last stretch of that path, so crossing it means
  # the resident has walked out of the camera's reach.
  - - 0.08
    - 0.78
  - - 0.36
    - 0.78
  - - 0.36
    - 0.60
  - - 0.08
    - 0.60
  risk: high
- name: hallway
  type: dwell
  points:
  - - 0.05
    - 0.55
  - - 0.75
    - 0.50
  - - 0.95
    - 1.0
  - - 0.02
    - 1.0
- name: shopfront
  type: dwell
  points:
  - - 0.72
    - 0.42
  - - 0.98
    - 0.40
  - - 1.0
    - 1.0
  - - 0.80
    - 1.0
- name: bathroom_interior
  type: exclusion
  private: true
  points:
  - - 0.0
    - 0.0
  - - 0.06
    - 0.0
  - - 0.06
    - 0.35
  - - 0.0
    - 0.35
